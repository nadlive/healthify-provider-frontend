version: 0.2

env:
  variables:
    IMAGE_TAG: "prod-latest"

phases:
  pre_build:
    commands:
      - echo Checking if provider source changed
      - LAST_BUILT=$(aws ssm get-parameter --name "$LAST_BUILT_PARAM" --query 'Parameter.Value' --output text 2>/dev/null || echo "")
      - if [ "$LAST_BUILT" = "$CODEBUILD_RESOLVED_SOURCE_VERSION" ]; then echo "No provider changes. Skipping build."; echo "true" > skip-deploy.txt; echo "[{\"name\":\"provider\",\"imageUri\":\"$ECR_REPOSITORY_URI:$IMAGE_TAG\"}]" > imagedefinitions.json; exit 0; fi
      - echo Fetching provider env vars from SSM /provider/*
      - EXPO_PUBLIC_API=$(aws ssm get-parameter --name "/provider/EXPO_PUBLIC_API" --query 'Parameter.Value' --output text)
      - EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$(aws ssm get-parameter --name "/provider/EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" --query 'Parameter.Value' --output text)
      - EXPO_PUBLIC_SIGNALING_SERVER=$(aws ssm get-parameter --name "/provider/EXPO_PUBLIC_SIGNALING_SERVER" --query 'Parameter.Value' --output text)
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI
      - echo Building PROD Docker image
  build:
    commands:
      - echo Building the Docker image for PROD
      - docker build -f Dockerfile.prod --build-arg EXPO_PUBLIC_API="$EXPO_PUBLIC_API" --build-arg EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID="$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" --build-arg EXPO_PUBLIC_SIGNALING_SERVER="$EXPO_PUBLIC_SIGNALING_SERVER" -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ECR_REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo Pushing the Docker image to PROD ECR
      - docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
      - echo Creating imagedefinitions.json
      - echo "[{\"name\":\"provider\",\"imageUri\":\"$ECR_REPOSITORY_URI:$IMAGE_TAG\"}]" > imagedefinitions.json
      - cat imagedefinitions.json
      - aws ssm put-parameter --name "$LAST_BUILT_PARAM" --value "$CODEBUILD_RESOLVED_SOURCE_VERSION" --type String --overwrite
      - echo "Triggering ECS deployment (force new deployment)"
      - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment

artifacts:
  files:
    - imagedefinitions.json
    - skip-deploy.txt
  base-directory: $CODEBUILD_SRC_DIR
